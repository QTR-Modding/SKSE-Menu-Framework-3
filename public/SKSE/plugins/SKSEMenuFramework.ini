[General]

; Menu toggle key for keyboard
ToggleKey = F1

; SinglePress, Hold, DoublePress, OFF
ToggleMode = SINGLEPRESS

; Menu toggle key for Gamepad
ToggleKeyGamePad = LB

; SinglePress, Hold, DoublePress, OFF
; OFF disables the binding entirely - the menu can still be reached by
; whatever else opens it, and closed with B on a gamepad.
ToggleModeGamePad = DOUBLEPRESS

; Milliseconds allowed between the two presses of a DoublePress. 50-2000.
DoublePressThreshold = 300

; Swallow the toggle key's press instead of passing it on to the game. Worth
; enabling on a gamepad, where the toggle key is usually a bound action and
; would otherwise fire when you open or close the menu.
ConsumeToggleKey = false
FreezeTimeOnMenu = true
BlurBackgroundOnMenu = true
MenuStyle = SKYRIMDEFAULT


[Fonts]
PrimaryFont = MainFont.ttf
EnableChinese = false
EnableJapanese = false
EnableKorean = false
EnableCyrillic = false
EnableThai = false
EnableTurkish = false
MinFontSize = 12.000000
MaxFontSize = 64.000000
FontSizeMedium = 32.000000
